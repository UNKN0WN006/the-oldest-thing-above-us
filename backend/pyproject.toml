[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "above-us-backend"
version = "0.1.0"
description = "Above Us — observer-relative pass discovery for heritage spacecraft"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "skyfield>=1.49",
  "sgp4>=2.23",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ephem>=4.1", "ruff>=0.5", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network access to celestrak.org (deselected by default)"]
addopts = "-m 'not live'"
filterwarnings = [
  "ignore:Setting the dtype on a NumPy array:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["data/*.json", "data/snapshot/*.json"]
